services:
  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: broker
    restart: on-failure
    ports:
      - "9090:9090"
      - "8080:8080"
    environment:
      GOGC: "200"
      GOMEMLIMIT: "3000MiB"
      GOMAXPROCS: "3"
      GOMLX_BACKEND: "xla:cpu"
      PJRT_PLUGIN_LIBRARY_PATH: "/opt/xla/lib/go-xla"
      OMP_NUM_THREADS: "1"
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false"
    volumes:
      - nyaqueue-data:/data
    cpus: "3.0"
    mem_limit: "4g"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.tcp_fin_timeout: 30
      net.ipv4.ip_local_port_range: "1024 65000"
      net.ipv4.tcp_max_tw_buckets: 200000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  broker-exporter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: broker-exporter
    restart: on-failure
    ports:
      - "8083:8083"
    depends_on:
      - broker
    cpus: "0.1"
    mem_limit: "128m"

  producer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: producer
    restart: on-failure
    ports:
      - "8081:8081"
    depends_on:
      - broker
    cpus: "0.2"
    mem_limit: "256m"

  consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: consumer
    restart: on-failure
    ports:
      - "8082:8082"
    depends_on:
      - broker
      - producer
    cpus: "0.3"
    mem_limit: "256m"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
    depends_on:
      - broker-exporter
    cpus: "0.3"
    mem_limit: "256m"

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    cpus: "0.1"
    mem_limit: "128m"

  kafka:
    profiles: ["kafka"]
    image: public.ecr.aws/bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_NUM_NETWORK_THREADS: "4"
      KAFKA_CFG_NUM_IO_THREADS: "8"
      KAFKA_CFG_SOCKET_SEND_BUFFER_BYTES: "1048576"
      KAFKA_CFG_SOCKET_RECEIVE_BUFFER_BYTES: "1048576"
      KAFKA_CFG_MESSAGE_MAX_BYTES: "16777216"
    volumes:
      - kafka-data:/bitnami/kafka
    cpus: "1.0"
    mem_limit: "1536m"

  experiment:
    profiles: ["experiment"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: experiment
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      GOGC: "200"
      GOMEMLIMIT: "3000MiB"
      GOMLX_BACKEND: "xla:cpu"
      PJRT_PLUGIN_LIBRARY_PATH: "/opt/xla/lib/go-xla"
      OMP_NUM_THREADS: "1"
      XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false"
    command:
      - "--experiment.mode=inprocess,grpc,http,kafka"
      - "--experiment.scenarios=all"
      - "--experiment.algorithms=all"
      - "--experiment.kafka_brokers=kafka:9092"
      - "--experiment.broker_addr=broker:9090"
      - "--experiment.http_broker_addr=broker:8080"
      - "--experiment.duration=30s"
      - "--experiment.output=/results"
    depends_on:
      broker:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./results:/results
    tmpfs:
      - /tmp:size=512m
    cpus: "3.0"
    mem_limit: "4g"
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.tcp_fin_timeout: 30
      net.ipv4.ip_local_port_range: "1024 65000"
      net.ipv4.tcp_max_tw_buckets: 200000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  nyaqueue-data:
  kafka-data:
  prometheus-data:
  grafana-data:
